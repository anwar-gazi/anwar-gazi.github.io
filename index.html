<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhajul Anwar – Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0f14;
      color: #e5e7eb;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) { .page { grid-template-columns: 1fr; } }
    .card {
      background: linear-gradient(145deg, #161922, #12141c);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .sidebar { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .avatar-box {
      width: 110px; height: 110px; border-radius: 22px; overflow: hidden;
      position: relative; border: 3px solid rgba(245, 184, 74, 0.35); margin: 0 auto;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #34d399;
      position: absolute; bottom: 10px; right: 10px; border: 2px solid #12141c;
    }
    .sidebar h1 { text-align: center; margin: 10px 0 4px; font-size: 20px; font-weight: 600; color: #fff; }
    .sidebar .role { text-align: center; font-size: 13px; color: #cbd5e1; }
    .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 12px 0; }
    .contact-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
    .contact-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px; }
    .contact-value { font-size: 13px; color: #e5e7eb; word-break: break-word; }
    .socials { display: flex; justify-content: center; gap: 10px; font-size: 13px; color: #cbd5e1; }
    .main-card { padding: 20px; }
    .tabs { display: flex; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 16px; }
    .tab-btn { background: none; border: none; padding: 10px 6px; color: #cbd5e1; font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: #f5b84a; border-color: #f5b84a; }
    .section-title { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 10px; }
    .about-text { color: #d1d5db; line-height: 1.6; font-size: 14px; margin: 0 0 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .service-card { border-radius: 14px; padding: 14px; background: linear-gradient(145deg, #1a1d26, #161922); border: 1px solid rgba(255, 255, 255, 0.04); }
    .service-card h4 { margin: 0 0 6px; color: #fff; font-size: 15px; font-weight: 600; }
    .service-card p { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .skills-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .skill-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 12px; }
    .skill-card h5 { margin: 0 0 8px; color: #fff; font-size: 14px; font-weight: 600; }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); color: #e5e7eb; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .timeline { position: relative; padding-left: 18px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #f5b84a, rgba(245, 184, 74, 0.2)); }
    .timeline-item { position: relative; padding: 0 0 16px 0; }
    .timeline-dot { position: absolute; left: -2px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: #f5b84a; box-shadow: 0 0 0 4px rgba(245, 184, 74, 0.15); }
    .timeline-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .timeline-title { margin: 0; color: #fff; font-size: 15px; font-weight: 600; }
    .timeline-sub { margin: 2px 0 0; color: #cbd5e1; font-size: 12px; }
    .timeline-period { background: rgba(255, 255, 255, 0.05); color: #e5e7eb; font-size: 11px; padding: 4px 8px; border-radius: 8px; flex-shrink: 0; }
    .timeline-bullets { margin: 10px 0 0; padding-left: 14px; color: #d1d5db; font-size: 13px; line-height: 1.5; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="page">
    <!-- Sidebar -->
    <aside class="card sidebar">
      <div class="avatar-box">
        <img src="../minhaj.jpg" alt="Minhajul Anwar" style="width: 100%; height: 100%; object-fit: cover;">
        <span class="status-dot"></span>
      </div>
      <h1 id="side-name">Minhajul Anwar</h1>
      <p id="side-title" class="role">Senior Backend / Full-Stack Engineer</p>
      <hr class="divider">
      <div class="contact-item">
        <span style="color:#f5b84a;">✉️</span>
        <div>
          <div class="contact-label">Email</div>
          <a id="side-email" href="#" class="contact-value">minhaj.me.bd@gmail.com</a>
        </div>
      </div>
      <div class="contact-item">
        <span style="color:#f5b84a;">📞</span>
        <div>
          <div class="contact-label">Phone</div>
          <a id="side-phone" href="#" class="contact-value">+88 01716-734974</a>
        </div>
      </div>
      <div class="contact-item">
        <span style="color:#f5b84a;">📍</span>
        <div>
          <div class="contact-label">Location</div>
          <div id="side-location" class="contact-value">Dhaka, Bangladesh</div>
        </div>
      </div>
      <hr class="divider">
      <div class="socials">
        <a id="side-github" href="#" target="_blank" rel="noreferrer">GitHub</a>
        <a id="side-portfolio" href="#" target="_blank" rel="noreferrer">Portfolio</a>
      </div>
    </aside>

    <!-- Main -->
    <main class="card main-card">
      <div class="tabs">
        <button class="tab-btn active" data-tab="about">About</button>
        <button class="tab-btn" data-tab="resume">Resume</button>
        <button class="tab-btn" data-tab="portfolio">Portfolio</button>
      </div>

      <!-- About -->
      <section data-page="about" class="space-y-6">
        <div>
          <h2 class="section-title">About Me</h2>
          <p id="summary" class="about-text"></p>
        </div>

        <div>
          <h3 class="section-title" style="font-size: 18px;">What I'm Doing</h3>
          <div id="domains" class="grid-2"></div>
        </div>

        <div>
          <h3 class="section-title" style="font-size: 18px;">Skills</h3>
          <div id="skills" class="skills-wrap"></div>
        </div>
      </section>

      <!-- Portfolio -->
      <section data-page="portfolio" class="space-y-6 hidden">
        <div>
          <h3 class="section-title" style="font-size: 18px;">Portfolio</h3>
          <div class="timeline" id="portfolio-list"></div>
        </div>
      </section>

      <!-- Resume -->
      <section data-page="resume" class="space-y-6 hidden">
        <div>
          <h3 class="section-title" style="font-size: 18px;">Experience</h3>
          <div class="timeline" id="experience"></div>
        </div>
        <div>
          <h3 class="section-title" style="font-size: 18px;">Education</h3>
          <div class="timeline" id="education"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="../cv.js"></script>
  <script>
    const getCv = () => { try { return window.cvData; } catch (_) { return null; } };
    let tabsInitialized = false;

    const setContact = (cv) => {
      const c = cv?.contact || {};
      const phone = c.phone || '+88 01716-734974';
      const email = c.email || 'minhaj.me.bd@gmail.com';
      const loc = c.location || 'Dhaka, Bangladesh';
      const phoneHref = 'tel:' + phone.replace(/[^0-9+]/g, '').replace(/^\+?/, '+');
      document.getElementById('side-name').textContent = cv?.name || 'Minhajul Anwar';
      document.getElementById('side-title').textContent = cv?.title || 'Senior Backend / Full-Stack Engineer';
      const e = document.getElementById('side-email'); e.textContent = email; e.href = `mailto:${email}`;
      const p = document.getElementById('side-phone'); p.textContent = phone; p.href = phoneHref;
      document.getElementById('side-location').textContent = loc;
      document.getElementById('side-github').href = c.links?.github || 'https://github.com/anwar-gazi';
      document.getElementById('side-portfolio').href = c.links?.portfolio || 'https://anwar-gazi.github.io';
    };

    const renderSummary = (cv) => { document.getElementById('summary').textContent = cv?.summary || ''; };

    const renderDomains = (cv) => {
      const wrap = document.getElementById('domains');
      wrap.innerHTML = '';
      (cv?.domains || []).forEach((d, idx) => {
        const card = document.createElement('div');
        card.className = 'service-card';
        const icon = ['💻','🧭','🛠️','📈','🔒','⚡'][idx % 6];
        card.innerHTML = `
          <div style="display:flex; gap:12px;">
            <div style="font-size:18px; color:#f5b84a;">${icon}</div>
            <div>
              <h4>${d}</h4>
              <p>Hands-on delivery across this domain.</p>
            </div>
          </div>
        `;
        wrap.appendChild(card);
      });
    };

    const renderSkills = (cv) => {
      const container = document.getElementById('skills');
      container.innerHTML = '';
      Object.entries(cv?.skills || {}).forEach(([group, items]) => {
        const card = document.createElement('div');
        card.className = 'skill-card';
        card.innerHTML = `
          <h5>${group.replace(/([A-Z])/g, ' $1').trim()}</h5>
          <div class="skill-tags">
            ${(items || []).map(i => `<span class="tag">${i}</span>`).join('')}
          </div>
        `;
        container.appendChild(card);
      });
    };

    const renderTimeline = (entries, containerId) => {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      entries.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'timeline-item';
        row.innerHTML = `
          <span class="timeline-dot"></span>
          <div class="timeline-header">
            <div>
              <p class="timeline-title">${item.title || item.degree || ''}</p>
              <p class="timeline-sub">${item.company || item.school || ''}${item.location ? ' · ' + item.location : ''}</p>
            </div>
            <span class="timeline-period">${item.period || ''}</span>
          </div>
          ${item.bullets ? `<ul class="timeline-bullets">${item.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
        `;
        container.appendChild(row);
      });
    };

    const portfolioItems = [
      { title: 'AmiProbashi – Migrant Services Platform', link: '/portfolio/amiprobashi/index.html', period: '2025', blurb: 'GovTech • National migrant services SaaS' },
      { title: 'Multi-tenant News CMS (DoptorITMart)', link: '/portfolio/dailyniropekkho_doptorit/index.html', period: '2023–2025', blurb: 'Media CMS • Next.js + Laravel' },
      { title: 'ShurjoPay – Gateway Reliability', link: '/portfolio/shurjopay/index.html', period: '2022', blurb: 'Fintech • Payment gateway stability' },
      { title: 'ShurjoPay – Brac Bank COF', link: '/portfolio/shurjopay/shurjopay_bracbank_cof_case_study.html', period: '2022', blurb: 'Fintech • Card-on-file incident fix' },
      { title: 'CPC/CPA/CPM Bid Prediction (SulacoTec)', link: '/portfolio/sulacotec/index.html', period: '2022', blurb: 'AdTech • Bidding prediction platform' },
      { title: 'Freight Operations Portal (OneIXchange)', link: '/portfolio/freightforwarding_oneixchange/index.html', period: '2021', blurb: 'Logistics • Freight workflow portal' },
      { title: 'Healthcare Plan Operations (MS Concitus)', link: '/portfolio/healthcare/index.html', period: '2020', blurb: 'Healthcare • Plan ops tooling' },
      { title: 'Twilio + Asterisk IVR Automation', link: '/portfolio/telephony/index.html', period: '2019', blurb: 'Telephony • IVR automation' },
      { title: 'eBay Inventory & Packing Automation', link: '/portfolio/dropshipping/index.html', period: '2018', blurb: 'Ecommerce • Ops automation' },
      { title: 'IIG Ticketing & Notifications Prototype', link: '/portfolio/IIG/index.html', period: '2017', blurb: 'Infrastructure • Ticketing prototype' },
      { title: 'Notion-Clone – Login RCA', link: '/portfolio/projects/notion-clone-login-issue.html', period: 'Project', blurb: 'RCA • NextAuth login issue' },
      { title: 'Zustand Migration – Re-render Analysis', link: '/portfolio/projects/zustand-migration-rerender-analysis.html', period: 'Project', blurb: 'RCA • React state rerenders' },
      { title: 'BoardContext → Zustand Migration Docs', link: '/portfolio/projects/zustand-migration-docs.html', period: 'Project', blurb: 'Docs • State mgmt migration' },
      { title: 'TaskPane Flicker Investigation', link: '/portfolio/projects/taskpane-flicker-investigation.html', period: 'Project', blurb: 'Next.js UI flicker analysis' },
    ];

    const renderPortfolio = () => {
      const container = document.getElementById('portfolio-list');
      container.innerHTML = '';
      portfolioItems.forEach(item => {
        const row = document.createElement('div');
        row.className = 'timeline-item';
        row.innerHTML = `
          <span class="timeline-dot"></span>
          <div class="timeline-header">
            <div>
              <p class="timeline-title">${item.title}</p>
              <p class="timeline-sub">${item.blurb}</p>
            </div>
            <span class="timeline-period">${item.period}</span>
          </div>
          <div style="margin-top:8px;">
            <a href="${item.link}" class="contact-value" target="_blank" rel="noreferrer">Open case study ↗</a>
          </div>
        `;
        container.appendChild(row);
      });
    };

    const initTabs = () => {
      if (tabsInitialized) return;
      tabsInitialized = true;
      const buttons = document.querySelectorAll('.tab-btn');
      const pages = document.querySelectorAll('[data-page]');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          pages.forEach(p => p.classList.add('hidden'));
          const page = document.querySelector(`[data-page="${btn.dataset.tab}"]`);
          if (page) page.classList.remove('hidden');
        });
      });
    };

    function hydrate() {
      const cv = getCv();
      if (!cv) return;
      setContact(cv);
      renderSummary(cv);
      renderDomains(cv);
      renderSkills(cv);
      renderTimeline(cv.experience || [], 'experience');
      renderTimeline(cv.education || [], 'education');
      renderPortfolio();
      initTabs();
    }

    document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', hydrate) : hydrate();
  </script>
</body>
</html>
