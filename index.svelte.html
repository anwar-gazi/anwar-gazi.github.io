<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhajul Anwar – Portfolio (Svelte)</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" sizes="192x192" href="/shortcut.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0f14;
      color: #e5e7eb;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) { .page { grid-template-columns: 1fr; } }
    .card {
      background: linear-gradient(145deg, #161922, #12141c);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .sidebar { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .avatar-box {
      width: 110px; height: 110px; border-radius: 50%; overflow: hidden;
      position: relative; border: 3px solid rgba(245, 184, 74, 0.35); margin: 0 auto;
    }
    .sidebar h1 { text-align: center; margin: 10px 0 4px; font-size: 20px; font-weight: 600; color: #fff; }
    .sidebar .role { text-align: center; font-size: 13px; color: #cbd5e1; }
    .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 12px 0; }
    .contact-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
    .contact-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px; }
    .contact-value { font-size: 13px; color: #e5e7eb; word-break: break-word; }
    .socials { display: flex; justify-content: center; gap: 10px; font-size: 13px; color: #cbd5e1; }
    .main-card { padding: 20px; }
    .tabs { display: flex; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 16px; }
    .tab-btn { background: none; border: none; padding: 10px 6px; color: #cbd5e1; font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: #f5b84a; border-color: #f5b84a; }
    .section-title { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 10px; }
    .about-text { color: #d1d5db; line-height: 1.6; font-size: 14px; margin: 0 0 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .service-card { border-radius: 14px; padding: 14px; background: linear-gradient(145deg, #1a1d26, #161922); border: 1px solid rgba(255, 255, 255, 0.04); }
    .service-card h4 { margin: 0 0 6px; color: #fff; font-size: 15px; font-weight: 600; }
    .service-card p { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .skills-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .skill-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 12px; }
    .skill-card h5 { margin: 0 0 8px; color: #fff; font-size: 14px; font-weight: 600; }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); color: #e5e7eb; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .timeline { position: relative; display: flex; flex-direction: column; gap: 18px; padding-left: 0; margin: 0; list-style: none; }
    .timeline::before { content: ''; position: absolute; left: 7px; top: 0; bottom: 0; width: 2px; background: linear-gradient(180deg, #f5b84a, rgba(245, 184, 74, 0.2)); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 14px 1fr; column-gap: 10px; align-items: flex-start; padding: 0 0 2px 0; }
    .timeline-item::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: #f5b84a; box-shadow: 0 0 0 4px rgba(245, 184, 74, 0.15); grid-column: 1; margin-top: 6px; }
    .timeline-item > * { grid-column: 2; }
    .timeline-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .timeline-title { margin: 0; color: #fff; font-size: 15px; font-weight: 600; }
    .timeline-sub { margin: 2px 0 0; color: #cbd5e1; font-size: 12px; }
    .timeline-period { background: rgba(255, 255, 255, 0.05); color: #e5e7eb; font-size: 11px; padding: 4px 8px; border-radius: 8px; flex-shrink: 0; }
    .timeline-bullets { margin: 10px 0 0; padding-left: 14px; color: #d1d5db; font-size: 13px; line-height: 1.5; }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 50; }
    .modal-card { background: #0f1118; border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 14px; max-width: 360px; width: 100%; padding: 16px; color: #e5e7eb; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #fff; }
    .modal-close { background: none; border: none; color: #cbd5e1; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }
    .modal-list { margin: 0; padding-left: 18px; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .hidden { display: none !important; }
    .outbound-icon { font-size: 11px; opacity: 0.8; margin-left: 4px; }
  </style>
</head>
<body>
  <div id="root" style="text-align:center; padding:32px; color:#cbd5e1;">Loading Svelte version…</div>

  <script>
    (function () {
      const icons = ['💻','🧭','🛠️','📈','🔒','⚡','📦','☎️','🩺'];
      const formatGroup = (key = '') => key.replace(/([A-Z])/g, ' $1').trim();

      const safe = (val) => val == null ? '' : val;

      const renderDomains = (domains = {}) => {
        return Object.entries(domains).map(([name, detail], idx) => `
          <div class="service-card">
            <div style="display:flex; gap:12px;">
              <div style="font-size:18px; color:#f5b84a;">${icons[idx % icons.length]}</div>
              <div>
                <h4>${name}</h4>
                <p>${safe(detail?.summary) || 'Hands-on delivery across this domain.'}</p>
                ${detail?.url ? `<div style="margin-top:6px;"><a href="${detail.url}" class="contact-value" target="_blank" rel="noreferrer">Related work ↗</a></div>` : ''}
              </div>
            </div>
          </div>
        `).join('');
      };

      const renderSkills = (skills = {}) => {
        return Object.entries(skills).map(([group, items]) => {
          const tags = items && typeof items === 'object' ? Object.entries(items) : [];
          return `
            <div class="skill-card">
              <h5>${formatGroup(group)}</h5>
              <div class="skill-tags">
                ${tags.map(([name, info]) => info?.url
                  ? `<a class="tag" href="${info.url}" target="_blank" rel="noreferrer" title="${safe(info?.summary).replace(/"/g, '&quot;')}">${name} ↗</a>`
                  : `<span class="tag" title="${safe(info?.summary).replace(/"/g, '&quot;')}">${name}</span>`
                ).join('')}
              </div>
            </div>
          `;
        }).join('');
      };

      const renderTimeline = (items = []) => items.map((item) => `
        <div class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-header">
            <div>
              <p class="timeline-title">${safe(item.title)}</p>
              <p class="timeline-sub">${[item.company || item.school, item.location].filter(Boolean).join(' · ')}</p>
            </div>
            <span class="timeline-period">${safe(item.period)}</span>
          </div>
          ${item.bullets?.length ? `<ul class="timeline-bullets">${item.bullets.map(b => `<li>${b}</li>`).join('')}</ul>` : ''}
        </div>
      `).join('');

      const renderPortfolio = (items = []) => items.map((item) => `
        <div class="timeline-item">
          <span class="timeline-dot"></span>
          <div class="timeline-header">
            <div>
              <p class="timeline-title">${safe(item.title)}</p>
              <p class="timeline-sub">${safe(item.blurb)}</p>
            </div>
            <span class="timeline-period">${safe(item.period)}</span>
          </div>
          <div style="margin-top:8px;">
            <a href="${item.url || '#'}" class="contact-value" target="_blank" rel="noreferrer">Open case study ↗</a>
          </div>
        </div>
      `).join('');

      const mount = (cv) => {
        const root = document.getElementById('root');
        if (!root) return;
        root.innerHTML = `
          <div class="page">
            <aside class="card sidebar">
              <div class="avatar-box">
                <img src="${cv.photoSrc || '../minhaj.jpg'}" alt="${cv.name || 'Profile photo'}" style="width: 100%; height: 100%; object-fit: cover;" loading="lazy">
              </div>
              <h1 id="side-name">${safe(cv.name)}</h1>
              <p id="side-title" class="role">${safe(cv.title)}</p>
              <hr class="divider">
              <div class="contact-item">
                <span style="color:#f5b84a;">✉️</span>
                <div>
                  <div class="contact-label">Email</div>
                  <a id="side-email" class="contact-value" href="${cv.contact?.email ? `mailto:${cv.contact.email}` : '#'}">${cv.contact?.email || '—'}</a>
                </div>
              </div>
              <div class="contact-item">
                <span style="color:#f5b84a;">📞</span>
                <div>
                  <div class="contact-label">Phone</div>
                  <a id="side-phone" class="contact-value" href="${cv.contact?.phone ? 'tel:' + cv.contact.phone.replace(/[^0-9+]/g, '').replace(/^\\+?/, '+') : '#'}">${cv.contact?.phone || '—'}</a>
                </div>
              </div>
              <div class="contact-item">
                <span style="color:#f5b84a;">📍</span>
                <div>
                  <div class="contact-label">Location</div>
                  <div id="side-location" class="contact-value">${cv.contact?.location || '—'}</div>
                </div>
              </div>
              <hr class="divider">
              <div class="socials">
                <a id="side-github" href="${cv.contact?.links?.github || '#'}" target="_blank" rel="noreferrer">GitHub<span class="outbound-icon" aria-hidden="true">↗</span></a>
                <a id="side-portfolio" href="${cv.contact?.links?.portfolio || '#'}" target="_blank" rel="noreferrer">Portfolio<span class="outbound-icon" aria-hidden="true">↗</span></a>
              </div>
            </aside>

            <main class="card main-card">
              <div class="tabs">
                <button class="tab-btn active" data-tab="about">About</button>
                <button class="tab-btn" data-tab="resume">Experience</button>
                <button class="tab-btn" data-tab="portfolio">Portfolio</button>
              </div>

              <section data-page="about" class="space-y-6">
                <div>
                  <h2 class="section-title">About Me</h2>
                  <p id="summary" class="about-text">${safe(cv.summary)}</p>
                </div>

                <div>
                  <h3 class="section-title" style="font-size: 18px;">Industry Experience</h3>
                  <div id="domains" class="grid-2">${renderDomains(cv.domains || {})}</div>
                </div>

                <div>
                  <h3 class="section-title" style="font-size: 18px;">Skills</h3>
                  <div id="skills" class="skills-wrap">${renderSkills(cv.skills || {})}</div>
                </div>
              </section>

              <section data-page="portfolio" class="space-y-6 hidden">
                <div>
                  <h3 class="section-title" style="font-size: 18px;">
                    <a href="/portfolio/index.html" target="_blank" rel="noreferrer" style="color: inherit; text-decoration: none;">Portfolio ↗</a>
                  </h3>
                  <div id="portfolio-list" class="timeline">${renderPortfolio(cv.portfolioItems || [])}</div>
                </div>
              </section>

              <section data-page="resume" class="space-y-6 hidden">
                <div>
                  <h3 class="section-title" style="font-size: 18px;">Experience</h3>
                  <div id="experience" class="timeline">${renderTimeline(cv.experience || [])}</div>
                </div>
                <div>
                  <h3 class="section-title" style="font-size: 18px;">Education</h3>
                  <div id="education" class="timeline">${renderTimeline(cv.education || [])}</div>
                </div>
              </section>
            </main>
          </div>

          <footer style="text-align:center; font-size:10px; opacity:0.25; margin:12px 0;">
            <button id="version-info-trigger" type="button" style="background:none; border:none; color:inherit; cursor:pointer; padding:0; font:inherit;">This page: Svelte</button> · Other versions:
            <a href="/index.html" style="color:inherit;">Hydrated</a> ·
            <a href="/index.static.html" style="color:inherit;">Static snapshot</a> ·
            <a href="/index.react.html" style="color:inherit;">React (Babel)</a> ·
            <a href="/index.react.bundled.html" style="color:inherit;">React (bundled)</a> ·
            <a href="/index.vue.html" style="color:inherit;">Vue</a> ·
            <a href="/index.svelte.html" style="color:inherit;">Svelte</a>
          </footer>

          <div id="version-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="version-modal-title">
            <div class="modal-card">
              <div class="modal-header">
                <span id="version-modal-title">Svelte version</span>
                <button class="modal-close" type="button" aria-label="Close version info">x</button>
              </div>
              <ul class="modal-list">
              <li>Client-rendered page populated from the data source.</li>
              <li>Domains and skills link to related portfolio work.</li>
              <li>Falls back to other versions via footer links if needed.</li>
            </ul>
          </div>
        </div>
        `;

        // Tabs
        const buttons = root.querySelectorAll('.tab-btn');
        const pages = root.querySelectorAll('[data-page]');
        buttons.forEach((btn) => {
          btn.addEventListener('click', () => {
            buttons.forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            pages.forEach((p) => p.classList.add('hidden'));
            const page = root.querySelector(`[data-page="${btn.dataset.tab}"]`);
            if (page) page.classList.remove('hidden');
          });
        });

        // Modal
        const modal = document.getElementById('version-modal');
        const trigger = document.getElementById('version-info-trigger');
        const closeBtn = modal ? modal.querySelector('.modal-close') : null;
        const hide = () => modal && modal.classList.add('hidden');
        const show = () => modal && modal.classList.remove('hidden');
        if (trigger && modal) trigger.addEventListener('click', show);
        if (closeBtn) closeBtn.addEventListener('click', hide);
        if (modal) modal.addEventListener('click', (e) => { if (e.target === modal) hide(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') hide(); });
      };

      fetch('/cv.json', { cache: 'no-store', credentials: 'same-origin' })
        .then((res) => res.ok ? res.json() : Promise.reject())
        .then((cv) => mount(cv))
        .catch(() => {
          window.location.href = '/index.static.html';
        });
    })();
  </script>
</body>
</html>
