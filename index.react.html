<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minhajul Anwar – Portfolio (React)</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <link rel="icon" sizes="192x192" href="/shortcut.png" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0d0f14;
      color: #e5e7eb;
    }
    a { color: inherit; text-decoration: none; }
    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 16px 48px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
    }
    @media (max-width: 960px) { .page { grid-template-columns: 1fr; } }
    .card {
      background: linear-gradient(145deg, #161922, #12141c);
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
    }
    .sidebar { padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .avatar-box {
      width: 110px; height: 110px; border-radius: 22px; overflow: hidden;
      position: relative; border: 3px solid rgba(245, 184, 74, 0.35); margin: 0 auto;
    }
    .status-dot {
      width: 10px; height: 10px; border-radius: 50%; background: #34d399;
      position: absolute; bottom: 10px; right: 10px; border: 2px solid #12141c;
    }
    .sidebar h1 { text-align: center; margin: 10px 0 4px; font-size: 20px; font-weight: 600; color: #fff; }
    .sidebar .role { text-align: center; font-size: 13px; color: #cbd5e1; }
    .divider { border: none; border-top: 1px solid rgba(255, 255, 255, 0.08); margin: 12px 0; }
    .contact-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; }
    .contact-label { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; margin-bottom: 2px; }
    .contact-value { font-size: 13px; color: #e5e7eb; word-break: break-word; }
    .socials { display: flex; justify-content: center; gap: 10px; font-size: 13px; color: #cbd5e1; }
    .main-card { padding: 20px; }
    .tabs { display: flex; gap: 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.06); margin-bottom: 16px; }
    .tab-btn { background: none; border: none; padding: 10px 6px; color: #cbd5e1; font-size: 14px; border-bottom: 2px solid transparent; cursor: pointer; }
    .tab-btn.active { color: #f5b84a; border-color: #f5b84a; }
    .section-title { font-size: 22px; font-weight: 600; color: #fff; margin: 0 0 10px; }
    .about-text { color: #d1d5db; line-height: 1.6; font-size: 14px; margin: 0 0 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
    .service-card { border-radius: 14px; padding: 14px; background: linear-gradient(145deg, #1a1d26, #161922); border: 1px solid rgba(255, 255, 255, 0.04); }
    .service-card h4 { margin: 0 0 6px; color: #fff; font-size: 15px; font-weight: 600; }
    .service-card p { margin: 0; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .skills-wrap { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
    .skill-card { background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 12px; padding: 12px; }
    .skill-card h5 { margin: 0 0 8px; color: #fff; font-size: 14px; font-weight: 600; }
    .skill-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.08); color: #e5e7eb; padding: 4px 8px; border-radius: 999px; font-size: 12px; }
    .timeline {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding-left: 0;
      margin: 0;
      list-style: none;
    }
    .timeline::before {
      content: '';
      position: absolute;
      left: 7px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: linear-gradient(180deg, #f5b84a, rgba(245, 184, 74, 0.2));
    }
    .timeline-item {
      position: relative;
      display: grid;
      grid-template-columns: 14px 1fr;
      column-gap: 10px;
      align-items: flex-start;
      padding: 0 0 2px 0;
    }
    .timeline-item::before {
      content: '';
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #f5b84a;
      box-shadow: 0 0 0 4px rgba(245, 184, 74, 0.15);
      grid-column: 1;
      margin-top: 6px;
    }
    .timeline-item > * {
      grid-column: 2;
    }
    .timeline-header { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
    .timeline-title { margin: 0; color: #fff; font-size: 15px; font-weight: 600; }
    .timeline-sub { margin: 2px 0 0; color: #cbd5e1; font-size: 12px; }
    .timeline-period { background: rgba(255, 255, 255, 0.05); color: #e5e7eb; font-size: 11px; padding: 4px 8px; border-radius: 8px; flex-shrink: 0; }
    .timeline-bullets { margin: 10px 0 0; padding-left: 14px; color: #d1d5db; font-size: 13px; line-height: 1.5; }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50;
    }
    .modal-card {
      background: #0f1118;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      max-width: 360px;
      width: 100%;
      padding: 16px;
      color: #e5e7eb;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: #fff; }
    .modal-close { background: none; border: none; color: #cbd5e1; font-size: 16px; cursor: pointer; padding: 4px; line-height: 1; }
    .modal-list { margin: 0; padding-left: 18px; color: #cbd5e1; font-size: 13px; line-height: 1.5; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script type="text/babel" data-presets="env,react">
    (() => {
      const icons = ['💻', '🧭', '🛠️', '📈', '🔒', '⚡'];
      const formatGroup = (key = '') =>
        key.replace(/([A-Z])/g, ' $1').replace(/^\w/, (c) => c.toUpperCase());
      const phoneHref = (phone = '') =>
        'tel:' + phone.replace(/[^0-9+]/g, '').replace(/^\+?/, '+');

      const TabButton = ({ id, active, onChange, children }) => (
        <button
          className={`tab-btn${active === id ? ' active' : ''}`}
          data-tab={id}
          onClick={() => onChange(id)}
          type="button"
        >
          {children}
        </button>
      );

      const Sidebar = ({ cv }) => {
        const contact = cv.contact || {};
        const github = contact.links?.github;
        const portfolioLink = contact.links?.portfolio;
        return (
          <aside className="card sidebar">
            <div className="avatar-box">
              <img
                src={cv.photoSrc || '../minhaj.jpg'}
                alt={cv.name || 'Profile photo'}
                style={{ width: '100%', height: '100%', objectFit: 'cover' }}
                loading="lazy"
              />
              <span className="status-dot"></span>
            </div>
            <h1 id="side-name">{cv.name}</h1>
            <p id="side-title" className="role">{cv.title}</p>
            <hr className="divider" />
            <div className="contact-item">
              <span style={{ color: '#f5b84a' }}>✉️</span>
              <div>
                <div className="contact-label">Email</div>
                <a
                  id="side-email"
                  className="contact-value"
                  href={contact.email ? `mailto:${contact.email}` : undefined}
                >
                  {contact.email || '—'}
                </a>
              </div>
            </div>
            <div className="contact-item">
              <span style={{ color: '#f5b84a' }}>📞</span>
              <div>
                <div className="contact-label">Phone</div>
                <a
                  id="side-phone"
                  className="contact-value"
                  href={contact.phone ? phoneHref(contact.phone) : undefined}
                >
                  {contact.phone || '—'}
                </a>
              </div>
            </div>
            <div className="contact-item">
              <span style={{ color: '#f5b84a' }}>📍</span>
              <div>
                <div className="contact-label">Location</div>
                <div id="side-location" className="contact-value">
                  {contact.location || '—'}
                </div>
              </div>
            </div>
            <hr className="divider" />
            <div className="socials">
              <a id="side-github" href={github || '#'} target="_blank" rel="noreferrer">GitHub</a>
              <a id="side-portfolio" href={portfolioLink || '#'} target="_blank" rel="noreferrer">Portfolio</a>
            </div>
          </aside>
        );
      };

      const AboutTab = ({ cv }) => (
        <section data-page="about" className="space-y-6">
          <div>
            <h2 className="section-title">About Me</h2>
            <p id="summary" className="about-text">{cv.summary}</p>
          </div>

          <div>
            <h3 className="section-title" style={{ fontSize: '18px' }}>What I'm Doing</h3>
            <div id="domains" className="grid-2">
              {(cv.domains || []).map((domain, idx) => (
                <div className="service-card" key={domain}>
                  <div style={{ display: 'flex', gap: '12px' }}>
                    <div style={{ fontSize: '18px', color: '#f5b84a' }}>
                      {icons[idx % icons.length]}
                    </div>
                    <div>
                      <h4>{domain}</h4>
                      <p>Hands-on delivery across this domain.</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div>
            <h3 className="section-title" style={{ fontSize: '18px' }}>Skills</h3>
            <div id="skills" className="skills-wrap">
              {Object.entries(cv.skills || {}).map(([group, items]) => (
                <div className="skill-card" key={group}>
                  <h5>{formatGroup(group)}</h5>
                  <div className="skill-tags">
                    {(items || []).map((item) => (
                      <span className="tag" key={item}>{item}</span>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );

      const ResumeTab = ({ experience, education }) => (
        <section data-page="resume" className="space-y-6">
          <div>
            <h3 className="section-title" style={{ fontSize: '18px' }}>Experience</h3>
            <div id="experience" className="timeline">
              {experience.map((item, idx) => (
                <div className="timeline-item" key={`${item.title}-${idx}`}>
                  <div className="timeline-header">
                    <div>
                      <p className="timeline-title">{item.title}</p>
                      <p className="timeline-sub">
                        {[item.company, item.location].filter(Boolean).join(' · ')}
                      </p>
                    </div>
                    <span className="timeline-period">{item.period}</span>
                  </div>
                  {item.bullets?.length ? (
                    <ul className="timeline-bullets">
                      {item.bullets.map((b, bIdx) => <li key={`${idx}-${bIdx}`}>{b}</li>)}
                    </ul>
                  ) : null}
                </div>
              ))}
            </div>
          </div>
          <div>
            <h3 className="section-title" style={{ fontSize: '18px' }}>Education</h3>
            <div id="education" className="timeline">
              {education.map((item, idx) => (
                <div className="timeline-item" key={`${item.school}-${idx}`}>
                  <div className="timeline-header">
                    <div>
                      <p className="timeline-title">{item.degree}</p>
                      <p className="timeline-sub">
                        {[item.school, item.location].filter(Boolean).join(' · ')}
                      </p>
                    </div>
                    <span className="timeline-period">{item.period}</span>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );

      const PortfolioTab = ({ items }) => (
        <section data-page="portfolio" className="space-y-6">
          <div>
            <h3 className="section-title" style={{ fontSize: '18px' }}>
              <a
                href="/portfolio/index.html"
                target="_blank"
                rel="noreferrer"
                style={{ color: 'inherit', textDecoration: 'none' }}
              >
                Portfolio ↗
              </a>
            </h3>
            <div id="portfolio-list" className="timeline">
              {items.map((item, idx) => (
                <div className="timeline-item" key={`${item.title}-${idx}`}>
                  <div className="timeline-header">
                    <div>
                      <p className="timeline-title">{item.title}</p>
                      <p className="timeline-sub">{item.blurb}</p>
                    </div>
                    <span className="timeline-period">{item.period}</span>
                  </div>
                  <div style={{ marginTop: '8px' }}>
                    <a
                      href={item.url || '#'}
                      className="contact-value"
                      target="_blank"
                      rel="noreferrer"
                    >
                      Open case study ↗
                    </a>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );

      const App = () => {
        const [tab, setTab] = React.useState('about');
        const [cv, setCv] = React.useState(null);
        const [error, setError] = React.useState(false);

        React.useEffect(() => {
          fetch('/cv.json', { cache: 'no-store', credentials: 'same-origin' })
            .then((res) => (res.ok ? res.json() : Promise.reject()))
            .then((data) => setCv(data))
            .catch(() => setError(true));
        }, []);

        React.useEffect(() => {
          if (error) window.location.href = '/index.static.html';
        }, [error]);

        if (!cv && !error) {
          return (
            <div style={{ color: '#cbd5e1', textAlign: 'center', padding: '32px' }}>
              Loading profile…
            </div>
          );
        }

        if (!cv) {
          return (
            <div style={{ color: '#cbd5e1', textAlign: 'center', padding: '32px' }}>
              Redirecting to static snapshot…
            </div>
          );
        }

        return (
          <>
            <div className="page">
              <Sidebar cv={cv} />
              <main className="card main-card">
                <div className="tabs">
                  <TabButton id="about" active={tab} onChange={setTab}>About</TabButton>
                  <TabButton id="resume" active={tab} onChange={setTab}>Resume</TabButton>
                  <TabButton id="portfolio" active={tab} onChange={setTab}>Portfolio</TabButton>
                </div>

                {tab === 'about' && <AboutTab cv={cv} />}
                {tab === 'resume' && <ResumeTab experience={cv.experience || []} education={cv.education || []} />}
                {tab === 'portfolio' && <PortfolioTab items={cv.portfolioItems || []} />}
              </main>
            </div>

            <footer style={{ textAlign: 'center', fontSize: '10px', opacity: 0.25, margin: '12px 0' }}>
              <button id="version-info-trigger" type="button" style={{ background: 'none', border: 'none', color: 'inherit', cursor: 'pointer', padding: 0, font: 'inherit' }}>This page: React (Babel)</button> · Other versions:{' '}
              <a href="/index.react.bundled.html" style={{ color: 'inherit' }}>React (bundled)</a> ·{' '}
              <a href="/index.html" style={{ color: 'inherit' }}>Hydrated</a> ·{' '}
              <a href="/index.static.html" style={{ color: 'inherit' }}>Static snapshot</a>
            </footer>
          </>
        );
      };

      const root = document.getElementById('root');
      ReactDOM.createRoot(root).render(<App />);
    })();
  </script>

  <div id="version-modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-labelledby="version-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <span id="version-modal-title">React (Babel)</span>
        <button class="modal-close" type="button" aria-label="Close version info">x</button>
      </div>
      <ul class="modal-list">
        <li>Uses React 18 UMD with in-browser Babel to run JSX.</li>
        <li>Pulls content from the data source for contact, domains, skills, experience, and portfolio.</li>
        <li>Client-rendered tabs; depends on Babel transform for older browsers.</li>
        <li>Falls back to the static snapshot if data fetch fails.</li>
      </ul>
    </div>
  </div>

  <script>
    (() => {
      const modal = document.getElementById('version-modal');
      if (!modal) return;
      document.addEventListener('click', (e) => {
        const target = e.target;
        if (target && target.id === 'version-info-trigger') {
          e.preventDefault();
          modal.classList.remove('hidden');
        }
        if (target && target.classList && target.classList.contains('modal-close')) {
          modal.classList.add('hidden');
        }
        if (target === modal) {
          modal.classList.add('hidden');
        }
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') modal.classList.add('hidden');
      });
    })();
  </script>
</body>
</html>
